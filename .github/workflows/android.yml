name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      # google-services.json (Firebase) — from a secret if set, otherwise from the repo if committed
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret"
          elif [ -f android/app/google-services.json ]; then
            echo "google-services.json found in repo"
          else
            echo "::warning::No google-services.json — the app builds, but native push notifications are disabled"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          # retry: the Gradle download from services.gradle.org sometimes times out
          for i in 1 2 3; do ./gradlew --version > /dev/null && break; echo "gradle download retry $i"; sleep 15; done
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../konan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: konan-apk
          path: konan.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: קונאן 1.0.${{ github.run_number }}
          files: konan.apk
          make_latest: true
